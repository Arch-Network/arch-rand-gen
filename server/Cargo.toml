[package]
name = "server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "oracle"
path = "src/main.rs"

[dependencies]
arch_sdk         = { path = "../../arch-network/sdk" }
oracle-program   = { path = "../oracle-program", features = ["no-entrypoint"] }
shared           = { path = "../shared" }
vrf-core         = { path = "../vrf-core" }
borsh            = { version = "1", default-features = false }
bitcoin          = { version = "0.32.3" }
tokio            = { version = "1", features = ["full"] }
serde_json       = "1"
getrandom        = "0.2"
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
